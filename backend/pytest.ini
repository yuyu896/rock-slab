[pytest]
DJANGO_SETTINGS_MODULE = rock_slab.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Use sqlite in-memory database for tests; timeout=30 → busy_timeout，多线程并发用例写锁排队而非立刻报 table is locked
override_ini =
    DATABASES={"default":{"ENGINE":"django.db.backends.sqlite3","NAME":":memory:","OPTIONS":{"timeout":30}}}
